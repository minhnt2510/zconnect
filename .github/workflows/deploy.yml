name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  ci:
    name: TypeCheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: soccial-media-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: soccial-media-web/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || '' }}
          VITE_SOCKET_PATH: ${{ secrets.VITE_SOCKET_PATH || '' }}
          VITE_BACKEND_TARGET: ${{ secrets.VITE_BACKEND_TARGET || '' }}

  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 900s
          script: |
            set -e

            cd ~/soccial-media-web
            git fetch origin
            git reset --hard origin/main

            npm install

            export VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}"
            export VITE_SOCKET_URL="${{ secrets.VITE_SOCKET_URL }}"
            export VITE_SOCKET_PATH="${{ secrets.VITE_SOCKET_PATH }}"
            export VITE_BACKEND_TARGET="${{ secrets.VITE_BACKEND_TARGET }}"
            export VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
            export VITE_TURN_URL="${{ secrets.VITE_TURN_URL }}"
            export VITE_TURN_USERNAME="${{ secrets.VITE_TURN_USERNAME }}"
            export VITE_TURN_CREDENTIAL="${{ secrets.VITE_TURN_CREDENTIAL }}"

            npm run build

            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r dist/* /usr/share/nginx/html/

            sudo nginx -t
            sudo systemctl restart nginx
