name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  ci:
    name: TypeCheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: soccial-media-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: soccial-media-web/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || '' }}
          VITE_SOCKET_PATH: ${{ secrets.VITE_SOCKET_PATH || '' }}
          VITE_BACKEND_TARGET: ${{ secrets.VITE_BACKEND_TARGET || '' }}

  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check deployment secrets
        id: check_secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EC2 secrets not configured. Deploy job skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Frontend
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 900s
          script_stop: true
          script: |
            set -euxo pipefail

            echo "=== Environment ==="
            whoami
            pwd
            node -v
            npm -v

            echo "=== Git ==="
            cd ~/soccial-media-web
            git remote -v
            git fetch origin
            git reset --hard origin/main
            ls -la

            echo "=== Install ==="
            npm install

            echo "=== Build ==="
            npm run build

            echo "=== Deploy ==="
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r dist/* /usr/share/nginx/html/

            sudo nginx -t
            sudo systemctl restart nginx
            echo "=== Done ==="
